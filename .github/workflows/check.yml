name: Проверка PUMP

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --locked
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 -m venv /tmp/pump-tests
      - run: /tmp/pump-tests/bin/pip install playwright==1.62.0
      - run: /tmp/pump-tests/bin/python -m playwright install --with-deps chromium
      - run: /tmp/pump-tests/bin/python tests/browser.py

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: rustup component add clippy
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo clippy --workspace --all-features --locked --all-targets -- -D warnings

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pump:ci .
      - name: Проверка контейнера
        run: |
          docker run -d --name pump -p 127.0.0.1:8080:8080 pump:ci
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 1 --max-time 3 http://127.0.0.1:8080/healthz
      - name: Лог контейнера при ошибке
        if: failure()
        run: docker logs pump
