[package]
name = "ui-liquid-glass"
version = "0.1.0"
edition = "2024"

[features]
default = ["web-bindings"]
web-bindings = ["dep:wasm-bindgen"]
dsp-only = []

[dependencies]
audio-dsp-engine = { path = "../audio-dsp-engine", default-features = false }

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
