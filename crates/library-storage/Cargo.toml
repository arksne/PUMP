[package]
name = "library-storage"
version = "0.1.0"
edition = "2024"
description = "Durable local music libraries, downloads and confined NAS streaming"

[features]
default = []
smb = ["dep:smb"]

[dependencies]
smb = { version = "0.11.1", optional = true }
anyhow = "1"
hex = "0.4"
bytes = "1"
fs2 = "0.4"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
lofty = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
