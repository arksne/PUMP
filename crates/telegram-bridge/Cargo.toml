[package]
name = "telegram-bridge"
version = "0.2.0"
edition = "2024"

[features]
default = []
smb = ["library-storage/smb"]

[dependencies]
futures-util = "0.3"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
lofty = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
teloxide = { version = "0.17", default-features = false, features = ["rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }

core-streaming = { path = "../core-streaming" }
library-storage = { path = "../library-storage" }
lyrics-engine = { path = "../lyrics-engine" }
ui-liquid-glass = { path = "../ui-liquid-glass" }
audio-dsp-engine = { path = "../audio-dsp-engine", default-features = false, features = ["decode", "analysis"] }
plugin-spine = { path = "../plugin-spine" }
social-integrations = { path = "../social-integrations" }
async-trait = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
imageproc = { version = "0.25", default-features = false }
ab_glyph = "0.2"
