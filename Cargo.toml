[workspace]
resolver = "3"
members = [".", "crates/*"]

[package]
name = "pump"
version = "0.2.0"
edition = "2024"
description = "PUMP music player and Telegram Mini App"

[dependencies]
anyhow = "1"
telegram-bridge = { path = "crates/telegram-bridge" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
strip = true

[profile.dev]
debug = 0

[profile.test]
debug = 0
