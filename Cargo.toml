[package]
name = "pump"
version = "0.1.0"
edition = "2024"
description = "PUMP music player and Telegram Mini App"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
lofty = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
teloxide = { version = "0.17", default-features = false, features = ["rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
